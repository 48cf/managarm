[package]
name = "freya"
version = "0.1.0"
edition = "2024"

[dependencies]
cpio_reader = "0.1"
# hel's `std` feature only gates its ambient executor, which freya has no std to
# gate on. The path is spelled out rather than inherited from the workspace
# because cargo refuses to let a member turn off default features that the
# workspace dependency leaves on.
hel = { path = "../rust/hel", default-features = false }
hel-sys.workspace = true
spin = "0.12"

[build-dependencies]
cc = "1.2.17"
